name: cross-platform-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Core syntax check
        run: python -m py_compile scripts/workbuddy_checkin.py scripts/install.py
      - name: Windows scheduled-task install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/install.py --time 23:57
          schtasks.exe /Query /TN "WorkBuddyAutoCheckin" /V /FO LIST
          if ($LASTEXITCODE -ne 0) { throw "Scheduled task was not registered" }
          python scripts/install.py --uninstall
          schtasks.exe /Query /TN "WorkBuddyAutoCheckin" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Scheduled task still exists after uninstall" }
          exit 0
